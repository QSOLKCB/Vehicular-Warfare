name: Release verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Numerical and browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
      - name: Check simulation identities, vendor bytes and numerical tests
        run: |
          python3 tools/identity.py --check
          node --test test/*.test.js
      - name: Build and unpack the offline candidate
        run: |
          python3 tools/package.py "$RUNNER_TEMP/Vehicular-Warfare.zip"
          python3 -m zipfile -e "$RUNNER_TEMP/Vehicular-Warfare.zip" "$RUNNER_TEMP/unpacked"
      - name: Exercise the packaged game in Chromium
        env:
          CHROMIUM: google-chrome
          CHROMIUM_BACKEND: software
          RIDGEFIRE_WEB_ROOT: ${{ runner.temp }}/unpacked/Vehicular-Warfare
        run: |
          google-chrome --version
          node tools/browser.mjs "$RUNNER_TEMP/controls" controls
      - name: Save the tested offline candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-game
          path: ${{ runner.temp }}/Vehicular-Warfare.zip
          if-no-files-found: error
          retention-days: 14
      - name: Save browser observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: control-acceptance
          path: ${{ runner.temp }}/controls
          if-no-files-found: ignore
          retention-days: 14
